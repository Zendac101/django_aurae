{% load static %}

<!DOCTYPE php>
<php lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aurae Admin</title>


        <link rel="stylesheet" href="{% static 'css/data_management_style.css' %}">
        <link rel="stylesheet" href="{% static 'css/data_table_style.css' %}">
        <link rel="stylesheet" href="{% static 'css/global.css' %}">

        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    </head>

    <body>

        <div id="container" class="expand">

            {% include 'admin_sidebar.html' %}

            <main class="main">


                <div class="header">
                    <div class="header-left">
                        <h1>Data Management</h1>
                        <p>Easily manage and organize air quality data.</p>
                    </div>
                </div>

                <div class="data-table">


                    <div id="table_div">

                        <table id="pollutant_table">
                            <thead>
                                <th>Date</th>
                                <th style="width: 15%;">
                                    <label for="locations">Location:</label>
                                    <select name="locations" id="location">
                                        <option value="">Select Location</option>
                                        {% for zipcode, municipality in location_options %}
                                        <option value="{{ zipcode }}">{{ municipality }}</option>
                                        {% empty %}
                                        <!-- This line will only show if your database returned zero rows -->
                                        <option value="">[No records found or column name error]</option>

                                        {% endfor %}

                                    </select>


                                </th>
                                <th>AQI</th>
                                <th>So2</th>
                                <th>Co</th>
                                <th>O3</th>
                                <th>NoX</th>
                                <th>Pm2.5</th>
                                <th>Pm10</th>




                            </thead>


                            <tbody id="table_pollutant">



                            </tbody>
                        </table>


                    </div>
                </div>

                <div class="table-actions">
                    <button class="green">Upload Data</button>
                    <button class="light">Download Data</button>
                    <button class="light">Delete Data</button>
                </div>

            </main>

        </div>

        <script src="{% static 'js/toggle_sidebar.js' %}">

        </script>

        <script>

            document.getElementById('location').addEventListener('change', function (event) {
                const selectedLoc = this.value;
                const tbody = document.getElementById('table_pollutant');
                const selectloc = document.getElementById("location");
                const selectedText = selectloc.options[selectloc.selectedIndex].text;

                tbody.innerHTML = "";



                fetch(`?locations=${encodeURIComponent(selectedLoc)}`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                    .then(response => response.json())
                    .then(result => {
                        if (result.success && result.data && result.data.length > 0) {
                            result.data.forEach(row => {
                                const tr = document.createElement('tr');


                                const columnOrder = [
                                    row.date, selectedText, row.aqi, row.so2,
                                    row.co, row.o3, row.nox, row.pm25, row.pm10
                                ];


                                let cellsHtml = '';
                                columnOrder.forEach(col => {
                                    cellsHtml += `<td>${col !== null && col !== undefined ? col : ''}</td>`;
                                });

                                tr.innerHTML = cellsHtml;
                                tbody.appendChild(tr);

                            });

                        }
                        else {
                            const tr = document.createElement('tr');
                            const td = document.createElement('td');

                            td.textContent = 'No data available';
                            td.colSpan = 9;
                            td.style.textAlign = 'center';

                            tr.appendChild(td);
                            tbody.appendChild(tr);
                        }

                    })
                    .catch(error => console.error('Error fetching data:', error));
            });


        </script>


    </body>
